name: Deploy frontend to GitHub Pages

# This deploys ONLY the static frontend (web/). The backend that holds your
# Kalshi API key must run somewhere else that supports server-side secrets —
# GitHub Pages serves plain static files to anyone, so it can never safely
# hold the private key. See README.md "Deploying" for the full picture.

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/deploy-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build frontend
        working-directory: web
        env:
          # Set an "API_BASE_URL" repository variable (Settings -> Secrets and
          # variables -> Actions -> Variables) to your deployed backend's
          # public origin, e.g. https://kalshi-button-api.onrender.com
          # It's not secret (it's just a URL), so a repo *variable* is right,
          # not a *secret*.
          VITE_API_BASE_URL: ${{ vars.API_BASE_URL }}
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
