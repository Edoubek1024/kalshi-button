name: Deploy frontend to GitHub Pages

# This deploys the static frontend (web/) only. Your Kalshi key is never part
# of this build — it's pasted into the running app and lives only in that
# browser's IndexedDB (see README.md "Security model" for the trade-offs of
# that approach). The only other piece is a secret-free CORS relay
# (relay/worker.js) that the frontend calls at runtime; its URL is baked in
# here via a repository variable since it's just a public URL, not a secret.

on:
  push:
    branches: [master]
    paths: ["web/**", ".github/workflows/deploy-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build frontend
        working-directory: web
        env:
          # Set a "RELAY_URL" repository variable (Settings -> Secrets and
          # variables -> Actions -> Variables) to your deployed Cloudflare
          # Worker's URL, e.g. https://kalshi-button-relay.yourname.workers.dev
          # It's not secret (it's just a URL, and the worker itself holds no
          # credentials), so a repo *variable* is right, not a *secret*.
          VITE_RELAY_URL: ${{ vars.RELAY_URL }}
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
